<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense &amp; Budget Tracker</title>
</head>
<body>
    <main>
        <h1>Expense &amp; Budget Tracker</h1>
        <h2>Add Income</h2>

        {% if errors %}
            <ul role="alert">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% if confirmation %}
            <p role="status">{{ confirmation }}</p>
        {% endif %}

        <form method="post">
            <label for="amount">Amount</label>
            <input
                id="amount"
                name="amount"
                type="number"
                min="0.01"
                step="0.01"
                value="{{ form_values.amount }}"
                required
            >

            <label for="description">Description</label>
            <input
                id="description"
                name="description"
                type="text"
                value="{{ form_values.description }}"
                required
            >

            <label for="date">Date</label>
            <input
                id="date"
                name="date"
                type="date"
                value="{{ form_values.date }}"
                required
            >

            <button type="submit">Add Income</button>
        </form>
    </main>
</body>
</html>
